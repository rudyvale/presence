name: Daily news

on:
  schedule:
    - cron: '0,30 7,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: presence-daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.export.outputs.ready }}
      article: ${{ steps.publish.outputs.article }}
      articles: ${{ steps.prepare.outputs.articles }}
      commit: ${{ steps.export.outputs.commit }}
    env:
      NEWS_AI_BACKEND: local
      NEWS_LOCAL_MODEL: qwen2.5:7b
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install editorial dependencies
        run: python -m pip install -r scripts/requirements-news.txt
      - name: Test editorial workflow
        run: python -m unittest discover -s tests
      - name: Verify news feed
        id: feed
        run: python scripts/auto_news.py --check-feed
      - name: Restore local AI
        if: steps.feed.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/presence-ollama
            ${{ runner.temp }}/presence-models
          key: presence-linux-ollama-0.11.10-qwen2.5-7b-reports-v2
      - name: Install local AI
        if: steps.feed.outputs.available == 'true'
        run: |
          echo "OLLAMA_MODELS=$RUNNER_TEMP/presence-models" >> "$GITHUB_ENV"
          if [ ! -x "$RUNNER_TEMP/presence-ollama/bin/ollama" ]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/ollama.tgz" 'https://github.com/ollama/ollama/releases/download/v0.11.10/ollama-linux-amd64.tgz'
            echo 'da2be71e972752e3099ef1d1226050d2b3d1ce79a4fec3bdb6edc70a7601e060  ollama.tgz' > "$RUNNER_TEMP/ollama.sha256"
            (cd "$RUNNER_TEMP" && sha256sum --check ollama.sha256)
            mkdir -p "$RUNNER_TEMP/presence-ollama"
            tar --extract --gzip --file "$RUNNER_TEMP/ollama.tgz" --directory "$RUNNER_TEMP/presence-ollama" --exclude='cuda*' --exclude='rocm*'
            rm "$RUNNER_TEMP/ollama.tgz"
          fi
          echo "$RUNNER_TEMP/presence-ollama/bin" >> "$GITHUB_PATH"
      - name: Start local AI
        if: steps.feed.outputs.available == 'true'
        run: |
          ollama serve > "$RUNNER_TEMP/presence-ai.log" 2>&1 &
          python - <<'PY'
          import json
          import time
          from urllib.request import ProxyHandler, build_opener
          opener = build_opener(ProxyHandler({}))
          for attempt in range(60):
              try:
                  with opener.open('http://127.0.0.1:11434/api/version', timeout=2) as response:
                      json.load(response)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Local AI did not start')
          PY
          ollama pull "$NEWS_LOCAL_MODEL"
          echo '::notice title=AI backend::Local Qwen 7B is ready; full-page research and editorial review use no API key.'
      - name: Research, repair and prepare full reports
        id: prepare
        if: steps.feed.outputs.available == 'true'
        continue-on-error: true
        run: python scripts/auto_news.py --repair-existing
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Publish validated changes
        id: publish
        run: |
          git add assets/js/news-data.js assets/img/articles articles docs/editorial feed.xml sitemap.xml index.html news/index.html crypto/index.html technology/index.html companies/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'Presence Editorial'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish researched Presence news reports'
          git push origin HEAD:main
          echo 'updated=true' >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          history = json.loads(Path('docs/editorial/auto-news-history.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('article=' + history['items'][-1]['article_url'] + '\n')
          PY
      - name: Export public site
        id: export
        if: steps.publish.outputs.updated == 'true' || github.event_name == 'push'
        run: |
          python scripts/export_site.py "$RUNNER_TEMP/presence-pages"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: steps.export.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/presence-pages
      - name: Stop local AI
        if: always() && steps.feed.outputs.available == 'true'
        run: |
          if command -v ollama > /dev/null; then
            ollama stop "$NEWS_LOCAL_MODEL" || true
          fi
      - name: Report incomplete editorial work
        if: always() && steps.prepare.outcome == 'failure'
        run: |
          echo '::error title=Editorial work incomplete::Some due reports or repairs failed. Validated changes were retained; failed material was not published.'
          exit 1

  deploy:
    needs: news
    if: always() && needs.news.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.news.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install publication checker
        run: python -m pip install -r scripts/requirements-news.txt
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public deployment
        env:
          EXPECTED_ARTICLE: ${{ needs.news.outputs.article }}
          EXPECTED_ARTICLES_JSON: ${{ needs.news.outputs.articles }}
        run: python3 scripts/check_deployment.py
