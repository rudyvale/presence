name: Daily news

on:
  schedule:
    - cron: '5,35 7,15 * * *'
  workflow_dispatch:
    inputs:
      restart:
        description: Cancel the active run and restart unfinished editorial work
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: presence-daily-news
  cancel-in-progress: ${{ inputs.restart == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[restart-news]')) }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      plan: ${{ steps.plan.outputs.plan }}
      ready: ${{ steps.plan.outputs.ready }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Pin editorial code revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-news.txt
      - name: Test editorial workflow
        run: python -m unittest discover -s tests
      - name: Plan due publications and legacy repairs
        id: plan
        run: python scripts/news_jobs.py plan

  research:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    name: Report ${{ matrix.job.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      NEWS_AI_BACKEND: local
      NEWS_LOCAL_MODEL: qwen2.5:7b
      NEWS_JOB_JSON: ${{ toJSON(matrix.job) }}
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-news.txt
      - name: Require source candidates
        run: |
          python - <<'PY'
          import json
          import os
          if not json.loads(os.environ['NEWS_JOB_JSON'])['sources']:
              raise SystemExit('A publication is due but no recent source candidates are available')
          PY
      - name: Restore local AI
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/presence-ollama
            ${{ runner.temp }}/presence-models
          key: presence-linux-ollama-0.11.10-qwen2.5-7b-reports-v2
      - name: Install local AI
        run: |
          echo "OLLAMA_MODELS=$RUNNER_TEMP/presence-models" >> "$GITHUB_ENV"
          if [ ! -x "$RUNNER_TEMP/presence-ollama/bin/ollama" ]; then
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --output "$RUNNER_TEMP/ollama.tgz" 'https://github.com/ollama/ollama/releases/download/v0.11.10/ollama-linux-amd64.tgz'
            echo 'da2be71e972752e3099ef1d1226050d2b3d1ce79a4fec3bdb6edc70a7601e060  ollama.tgz' > "$RUNNER_TEMP/ollama.sha256"
            (cd "$RUNNER_TEMP" && sha256sum --check ollama.sha256)
            mkdir -p "$RUNNER_TEMP/presence-ollama"
            tar --extract --gzip --file "$RUNNER_TEMP/ollama.tgz" --directory "$RUNNER_TEMP/presence-ollama" --exclude='cuda*' --exclude='rocm*'
            rm "$RUNNER_TEMP/ollama.tgz"
          fi
          echo "$RUNNER_TEMP/presence-ollama/bin" >> "$GITHUB_PATH"
      - name: Start local AI
        id: model
        run: python scripts/start_news_model.py
      - name: Research and validate one independent report
        run: python scripts/news_jobs.py worker --directory "$RUNNER_TEMP/presence-report"
      - name: Preserve validated report
        uses: actions/upload-artifact@v4
        with:
          name: presence-report-${{ matrix.job.key }}
          path: ${{ runner.temp }}/presence-report/report.json
          if-no-files-found: error
          retention-days: 3
      - name: Cache installed model
        if: always() && steps.model.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/presence-ollama
            ${{ runner.temp }}/presence-models
          key: presence-linux-ollama-0.11.10-qwen2.5-7b-reports-v2
      - name: Stop local AI
        if: always() && steps.model.outcome == 'success'
        run: ollama stop "$NEWS_LOCAL_MODEL" || true

  publish:
    needs: [plan, research]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.ready == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.export.outputs.ready }}
      commit: ${{ steps.export.outputs.commit }}
      articles: ${{ steps.apply.outputs.articles }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-news.txt
      - name: Collect validated reports
        if: needs.plan.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: presence-report-*
          path: ${{ runner.temp }}/presence-incoming
      - name: Apply independently validated reports
        id: apply
        if: needs.plan.outputs.ready == 'true'
        continue-on-error: true
        env:
          NEWS_PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: python scripts/news_jobs.py apply --directory "$RUNNER_TEMP/presence-incoming"
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Publish validated changes
        id: publish
        run: |
          git add assets/js/news-data.js assets/img/articles articles docs/editorial feed.xml sitemap.xml index.html news/index.html crypto/index.html technology/index.html companies/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'Presence Editorial'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish researched Presence news reports'
          git push origin HEAD:main
          echo 'updated=true' >> "$GITHUB_OUTPUT"
      - name: Export public site
        id: export
        if: steps.publish.outputs.updated == 'true' || github.event_name != 'schedule'
        run: |
          python scripts/export_site.py "$RUNNER_TEMP/presence-pages"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: steps.export.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/presence-pages
      - name: Report incomplete work
        if: always() && steps.apply.outcome == 'failure'
        run: |
          echo '::error title=Editorial work incomplete::Validated reports were retained; failed report jobs remain pending for a later retry.'
          exit 1

  deploy:
    needs: publish
    if: always() && needs.publish.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-news.txt
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify complete public deployment
        env:
          EXPECTED_ARTICLES_JSON: ${{ needs.publish.outputs.articles }}
        run: python scripts/check_deployment.py
