name: Publish validated reports

on:
  push:
    branches: [main]
    paths:
      - '.github/publishing.bin'
      - '.github/workflows/publish-reports.yml'
  schedule:
    - cron: '9,29,49 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Daily news]
    branches: [main]
    types: [completed]

concurrency:
  group: presence-site-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PUBLISHING_KEY: ${{ secrets.PUBLISHING_KEY }}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recover missing publication slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet cryptography==46.0.3
          python .github/site_services.py restore
          python .github/site_services.py run dependencies
          python .github/site_services.py run ensure

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: read
    outputs:
      deploy: ${{ steps.export.outputs.ready }}
      commit: ${{ steps.export.outputs.commit }}
      articles: ${{ steps.collect.outputs.articles }}
      delivery: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open publishing services
        run: |
          python -m pip install --quiet cryptography==46.0.3
          python .github/site_services.py restore
          python .github/site_services.py run dependencies
      - name: Collect independently validated reports
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/site_services.py run collect
      - name: Detect site delivery
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/site_services.py run mode
      - name: Validate public site
        run: python .github/site_services.py run validate
      - name: Publish ready changes
        id: publish
        run: |
          python .github/site_services.py seal
          python .github/site_services.py run publish
      - name: Check unfinished delivery
        id: delivery
        if: steps.publish.outputs.updated != 'true'
        run: python .github/site_services.py run delivery
      - name: Export public site
        id: export
        if: steps.publish.outputs.updated == 'true' || steps.delivery.outputs.pending == 'true'
        run: python .github/site_services.py run export "$RUNNER_TEMP/presence-pages"
      - uses: actions/upload-pages-artifact@v4
        if: steps.export.outputs.ready == 'true' && steps.mode.outputs.mode == 'workflow'
        with:
          path: ${{ runner.temp }}/presence-pages
      - name: Retain private diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics
          path: ${{ runner.temp }}/presence-diagnostics/*.bin
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open publishing services
        run: |
          python -m pip install --quiet cryptography==46.0.3
          python .github/site_services.py restore
          python .github/site_services.py run dependencies
      - uses: actions/deploy-pages@v4
        if: needs.publish.outputs.delivery == 'workflow'
        id: deployment
      - name: Verify complete published reports
        env:
          EXPECTED_ARTICLES_JSON: ${{ needs.publish.outputs.articles }}
          EXPECTED_DEPLOYMENT_SHA: ${{ needs.publish.outputs.commit }}
        run: python .github/site_services.py run check
      - name: Preserve publication delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presence-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/presence-delivery/delivery.bin
          if-no-files-found: ignore
          retention-days: 30
