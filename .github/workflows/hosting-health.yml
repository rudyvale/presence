name: Hosting health

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'CNAME'
      - '_config.yml'
      - 'scripts/check_hosting.py'
      - 'docs/editorial/auto-news-history.json'
      - '.github/workflows/hosting-health.yml'

permissions:
  contents: read
  pages: read

concurrency:
  group: presence-hosting-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public DNS, trusted TLS and page content
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_hosting.py
      - run: python -m pip install -r scripts/requirements-news.txt
      - name: Verify published reports and removed counters
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from auto_news import load_history
          from check_deployment import main
          os.environ['EXPECTED_ARTICLES_JSON'] = json.dumps([record['article_url'] for record in load_history()['items'] if record.get('format_version', 1) >= 3])
          main()
          PY
