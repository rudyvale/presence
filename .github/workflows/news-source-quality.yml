name: Editorial source checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'assets/js/news-data.js'
      - 'docs/editorial/auto-news-history.json'
      - 'scripts/**'
      - 'tests/test_news_sources.py'
      - '.github/workflows/news-source-quality.yml'

permissions:
  contents: read

concurrency:
  group: presence-source-quality
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-news.txt
      - name: Verify final editorial copy against full sources
        run: python scripts/check_news_sources.py --metrics
