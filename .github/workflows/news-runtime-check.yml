name: Publishing service check

on:
  workflow_dispatch:
    inputs:
      article:
        description: Existing article route to use for a read-only source sample
        type: string
        default: /articles/2026-10-14_bitcoin-risks-another-leverage-shakeout-if-us-cpi-runs-hot-analys-5c48598ca4/
      resources_only:
        description: Check and refresh publishing resources without creating a draft
        type: boolean
        default: false
      single_pass:
        description: Check one draft attempt without retries
        type: boolean
        default: false
      review_cases:
        description: Check full-report verification against private regression controls
        type: boolean
        default: false
      counted_edit:
        description: Verify recovery from unchanged word-count edits without publishing
        type: boolean
        default: false
      profile:
        description: Publishing resource profile to verify
        type: choice
        options: [quality, reasoned, compact, extended, standard]
        default: quality

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ inputs.resources_only == true && 'presence-publishing-resources' || format('presence-editorial-runtime-check-{0}-{1}', github.ref_name, inputs.profile || 'quality') }}
  cancel-in-progress: true

env:
  PUBLISHING_KEY: ${{ secrets.PUBLISHING_KEY }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.counted_edit && 80 || 40 }}
    env:
      SERVICE_PROFILE: ${{ inputs.profile || 'quality' }}
      NEWS_PROGRESS_CONTEXT: presence-news/sample-0
      NEWS_PROGRESS_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      NEWS_SAMPLE_ARTICLE: ${{ inputs.article || '/articles/2026-10-14_bitcoin-risks-another-leverage-shakeout-if-us-cpi-runs-hot-analys-5c48598ca4/' }}
      NEWS_SAMPLE_SINGLE_PASS: ${{ inputs.single_pass && 'true' || 'false' }}
      NEWS_SAMPLE_REVIEW_CASES: ${{ inputs.review_cases && 'true' || 'false' }}
      NEWS_SAMPLE_COUNTED_EDIT: ${{ inputs.counted_edit && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Open publishing services
        id: services
        run: |
          python -m pip install --quiet cryptography==46.0.3
          python .github/site_services.py restore
          python .github/site_services.py run dependencies
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ${{ steps.services.outputs.runtime_path }}
            ${{ steps.services.outputs.cache_path }}
          key: ${{ steps.services.outputs.cache_key }}
          restore-keys: ${{ steps.services.outputs.cache_seed }}
      - name: Verify publishing resources
        id: resources
        run: python .github/site_services.py run resources
      - name: Verify publishing service without publication
        if: inputs.resources_only != true
        run: python .github/site_services.py run sample --article "$NEWS_SAMPLE_ARTICLE"
      - name: Cache publishing resources
        if: always() && steps.resources.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.services.outputs.runtime_path }}
            ${{ steps.services.outputs.cache_path }}
          key: ${{ steps.services.outputs.cache_key }}
      - name: Stop publishing resources
        if: always() && inputs.resources_only != true
        run: python .github/site_services.py run stop
      - name: Retain private diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/presence-diagnostics/*.bin
          if-no-files-found: ignore
          retention-days: 3
